services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tax_deeds
      POSTGRES_PASSWORD: tax_deeds
      POSTGRES_DB: tax_deeds
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tax_deeds"]
      interval: 2s
      timeout: 2s
      retries: 15

  gcs:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443"]
    ports:
      - "4443:4443"

  # Defaults to the stub engine. For real OCR against a model on the host
  # (e.g. Ollama serving GLM-OCR):
  #   OCR_ENGINE=glm GLM_BASE_URL=http://host.docker.internal:11434 \
  #     docker compose up -d --build ocr
  ocr:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    environment:
      DATABASE_URL: postgres://ocr_service:ocr_service@postgres:5432/tax_deeds?sslmode=disable
      PORT: "9090"
      OCR_ENGINE: ${OCR_ENGINE:-stub}
      STORAGE_EMULATOR_HOST: gcs:4443
      GLM_BASE_URL: ${GLM_BASE_URL:-}
      GLM_MODEL: ${GLM_MODEL:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-dev}
      # Host-published OTLP port of the ../collector stack, via the host
      # gateway; empty keeps the worker stderr-only.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OCR_OTLP_ENDPOINT:-}
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      gcs:
        condition: service_started

volumes:
  pgdata:
