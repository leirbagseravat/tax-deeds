services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mortgage
      POSTGRES_PASSWORD: mortgage
      POSTGRES_DB: mortgage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mortgage"]
      interval: 2s
      timeout: 2s
      retries: 15

  gcs:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-port", "4443", "-public-host", "localhost:4443"]
    ports:
      - "4443:4443"

  ocr-stub:
    build:
      context: .
      dockerfile: Dockerfile.ocr-stub
    environment:
      DATABASE_URL: postgres://ocr_service:ocr_service@postgres:5432/mortgage?sslmode=disable
      PORT: "9090"
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
